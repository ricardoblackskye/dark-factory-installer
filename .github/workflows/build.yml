name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # AC4: produce a distributable, self-contained Windows executable.
      - name: Publish (self-contained win-x64)
        run: dotnet publish src/DarkFactoryInstaller --configuration Release --runtime win-x64 --self-contained true --output publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkFactoryInstaller-win-x64
          path: publish
          if-no-files-found: error

# NOTE: to make a build failure block merge (AC5), set this workflow as a required
# status check under the repo's branch protection rules (admin setting, not API-editable here).
