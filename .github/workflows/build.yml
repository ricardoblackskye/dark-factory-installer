name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # AC4: produce a single-file, self-contained Windows executable.
      - name: Publish (self-contained win-x64, single-file)
        run: dotnet publish src/DarkFactoryInstaller --configuration Release --runtime win-x64 --self-contained true --single-file true --output publish

      # AC4 (#11): sign the single-file EXE when a code-signing cert is supplied as a CI secret
      # (self-signed / internal-CA Authenticode, RFC3161 timestamping). No-op when the secret is
      # absent, so feature branches and local builds still produce an unsigned EXE.
      - name: Sign executable (self-signed / internal CA)
        if: ${{ secrets.CODESIGN_PFX != '' }}
        env:
          CODESIGN_PFX: ${{ secrets.CODESIGN_PFX }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          $pfxBytes = [System.Convert]::FromBase64String($env:CODESIGN_PFX)
          Set-Content -Path codesign.pfx -Value $pfxBytes -AsByteStream
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
            (Join-Path $PWD codesign.pfx), $env:CODESIGN_PASSWORD, 'Exportable')
          Set-AuthenticodeSignature -FilePath (Join-Path $PWD publish\DarkFactoryInstaller.exe) `
            -Certificate $cert -TimestampServerUrl http://timestamp.digicert.com -HashAlgorithm SHA256
          Remove-Item codesign.pfx

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkFactoryInstaller-win-x64
          path: publish
          if-no-files-found: error

# NOTE: to make a build failure block merge (AC5), set this workflow as a required
# status check under the repo's branch protection rules (admin setting, not API-editable here).
